name: Format Debug

on:
  push:
    branches:
      - codex/phase-2-permissions

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim

    steps:
      - uses: actions/checkout@v6
      - run: bundle install
      - name: Print formatted Guardian extension
        run: bundle exec stree format lib/discourse_sticker/guardian_extension.rb
