name: Phase 3 Format Debug

on:
  push:
    branches:
      - codex/phase-3-models

jobs:
  format:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:slim
    steps:
      - uses: actions/checkout@v6
      - run: bundle install
      - name: Print formatted models
        run: |
          for file in app/models/discourse_sticker/sticker.rb app/models/discourse_sticker/sticker_pack.rb app/models/discourse_sticker/sticker_pack_revision.rb; do
            echo "=== $file ==="
            bundle exec stree format "$file"
          done
